<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Biblioteca de Libros</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            margin: 0;
            padding: 48px 24px;
        }
        main {
            max-width: 960px;
            margin: 0 auto;
        }
        .encabezado {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 24px;
        }
        h1 {
            color: #f0c040;
            margin: 0;
        }
        .nuevo {
            background: #4a90d9;
            border-radius: 6px;
            color: white;
            padding: 10px 16px;
            text-decoration: none;
            white-space: nowrap;
        }
        .acciones {
            white-space: nowrap;
        }
        .acciones a, .acciones button {
            border: 0;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            display: inline-block;
            font: inherit;
            margin: 2px;
            padding: 7px 10px;
            text-decoration: none;
        }
        .editar {
            background: #4a90d9;
        }
        .eliminar {
            background: #c0392b;
        }
        .tabla-contenedor {
            overflow-x: auto;
            background: #16213e;
            border: 1px solid #4a90d9;
            border-radius: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid #30476b;
        }
        th {
            color: #f0c040;
        }
        tbody tr:last-child td {
            border-bottom: none;
        }
        .badge {
            border-radius: 12px;
            font-size: .85em;
            padding: 3px 10px;
        }
        .badge.ok { background: #1e6b3a; }
        .badge.no { background: #8a5a12; }
        .vacio {
            color: #aaa;
            text-align: center;
            padding: 24px;
        }
        @media (max-width: 560px) {
            body {
                padding: 32px 16px;
            }
            .encabezado {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="encabezado">
            <h1>Biblioteca de Libros</h1>
            <a class="nuevo" th:href="@{/nuevo}">+ Nuevo libro</a>
        </div>

        <div class="tabla-contenedor" th:if="${!#lists.isEmpty(libros)}">
            <table>
                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Autor</th>
                        <th>Género</th>
                        <th>Año</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="l : ${libros}">
                        <td th:text="${l.titulo}">-</td>
                        <td th:text="${l.autor}">-</td>
                        <td th:text="${l.genero}">-</td>
                        <td th:text="${l.anio}">-</td>
                        <td><span th:class="${l.disponible} ? 'badge ok' : 'badge no'"
                                  th:text="${l.disponible} ? 'Disponible' : 'Prestado'">-</span></td>
                        <td class="acciones">
                            <a class="editar" th:href="@{/editar/{id}(id=${l.id})}">Editar</a>
                            <form th:action="@{/eliminar/{id}(id=${l.id})}" method="post" style="display: inline"
                                  onsubmit="return confirm('¿Eliminar este libro?');">
                                <button class="eliminar" type="submit">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <p class="vacio" th:unless="${!#lists.isEmpty(libros)}">
            Aún no hay libros. Agrega el primero.
        </p>
    </main>
</body>
</html>
